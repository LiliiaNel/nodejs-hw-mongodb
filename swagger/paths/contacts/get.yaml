tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieve a paginated list of contacts for the authenticated user
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      example: 1
  - name: perPage
    in: query
    required: false
    schema:
      type: integer
      example: 10
  - name: sortBy
    in: query
    required: false
    schema:
      type: string
      example: "name"
  - name: sortOrder
    in: query
    required: false
    schema:
      type: string
      example: "asc"
  - name: isFavourite
    in: query
    required: false
    schema:
      type: boolean
      example: true
responses:
  '200':
    description: Successfully found contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 50
                totalPages:
                  type: integer
                  example: 5
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
