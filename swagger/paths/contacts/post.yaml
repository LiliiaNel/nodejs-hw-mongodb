tags:
  - Contacts
summary: Create contact
operationId: createContact
description: Create contact
security:
  - bearerAuth: []
requestBody: 
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            description: Contact name
            example: John Deere
          phoneNumber:
            type: string
            description: Phone number of the contact
            example: "+36301234567"
          email:
            type: string
            description: Email of the contact
            example: "example@mail.com"
            default: "" 
          contactType:
            type: string
            description: Type of contact
            enum:
              - home
              - work
              - personal
            example: personal
            default: personal
          isFavourite:
            description: Indicates whether the contact is marked as a favourite (true) or not (false)
            type: boolean
            default: false
          photo:
            type: string
            format: binary
            description: upload the contact's photo
            example: "https://res.cloudinary.com/demo/image/upload/v1234567890/sample.jpg"
            default: null

responses:
  '201':
    description: Successfully created contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: "Successfully created contact!"
            data:
              $ref: ../../components/schemas/contact.yaml
  '400':
    $ref: ../../components/responses/401.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml